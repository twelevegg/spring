version: 0.2

env:
  variables:
    AWS_REGION: ap-northeast-2
    ECR_REGISTRY: 081338828582.dkr.ecr.ap-northeast-2.amazonaws.com
    ECR_REPO_URI: 081338828582.dkr.ecr.ap-northeast-2.amazonaws.com/aicc-spring
    K8S_NAMESPACE: default

phases:
  install:
    commands:
      - curl -sSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      - chmod +x /usr/local/bin/kubectl
  pre_build:
    commands:
      - aws --version
      - IMAGE_TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-7)
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - docker build -t "$ECR_REPO_URI:$IMAGE_TAG" .
      - docker tag "$ECR_REPO_URI:$IMAGE_TAG" "$ECR_REPO_URI:latest"
  post_build:
    commands:
      - docker push "$ECR_REPO_URI:$IMAGE_TAG"
      - docker push "$ECR_REPO_URI:latest"
      - aws eks update-kubeconfig --name aicc-eks --region "$AWS_REGION"
      - SPRING_API_KEY=$(aws ssm get-parameter --name "/aicc/spring/SPRING_API_KEY" --with-decryption --query "Parameter.Value" --output text --region "$AWS_REGION")
      - if [ -z "$SPRING_API_KEY" ]; then echo "SPRING_API_KEY missing in SSM /aicc/spring/SPRING_API_KEY"; exit 1; fi
      - SPRING_API_KEY_B64=$(printf '%s' "$SPRING_API_KEY" | base64 | tr -d '\n')
      - kubectl patch secret aicc-spring-env -n "$K8S_NAMESPACE" --type='merge' -p "{\"data\":{\"SPRING_API_KEY\":\"${SPRING_API_KEY_B64}\"}}"
      - kubectl set image deployment/aicc-spring aicc-spring="$ECR_REPO_URI:$IMAGE_TAG"
      - kubectl rollout status deployment/aicc-spring
